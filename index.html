<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>れきしつなぎ 動作確認</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Antique&display=swap" rel="stylesheet">
<style>
/* 夜の舞台を全画面に置き、操作は手前に薄く重ねる。見本は暗い見た目だけで作る。 */
:root {
  color-scheme: dark;
  --night: #0b1430;
  --panel: rgba(11, 20, 48, .88);
  --line: #41568f;
  --paper: #fbf7ec;
  --mist: #c9d3ea;
  --gold: #f5b21a;
  --ink: #1c1a17;
  --display: "Zen Antique", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--night); color: var(--paper); font-family: var(--body); font-size: 16px; line-height: 1.6; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.hud { position: fixed; z-index: 2; }
.meter { top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); padding: 8px 12px; max-width: min(320px, calc(100vw - 24px)); background: var(--panel); border-radius: 8px; font-size: 14px; }
.meter b { font-size: 20px; color: var(--gold); font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 4px; margin-top: 6px; }
.seg button { min-height: 40px; padding: 2px 12px; background: none; border: 1.5px solid var(--line); border-radius: 6px; }
.seg button[aria-pressed="true"] { background: var(--paper); border-color: var(--paper); color: var(--ink); font-weight: 700; }
.note { margin: 6px 0 0; color: var(--mist); font-size: 13px; line-height: 1.5; }
.tools { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: flex; gap: 6px; }
.tool { min-height: 44px; padding: 4px 12px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; font-size: 14px; }
.controls { left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 12px; }
.pull { min-height: 56px; padding: 6px 20px; background: var(--panel); border: 2px solid var(--gold); border-radius: 8px; font-weight: 700; }
.pull.main { background: var(--gold); color: var(--ink); font-size: 18px; }
.skip { left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 6px 16px; background: var(--panel); border-radius: 999px; font-size: 14px; pointer-events: none; }
.result { right: max(24px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); width: min(400px, 44vw); padding: 18px 20px; background: var(--panel); border-left: 4px solid var(--gold); border-radius: 4px; }
.result h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.6; }
.result .tag { margin: 0; font-weight: 700; color: var(--gold); }
.result p { margin: 4px 0 10px; }
.result .sub { color: var(--mist); font-size: 14px; }
.result .again { min-height: 48px; width: 100%; padding: 4px 12px; background: var(--gold); border: 0; border-radius: 6px; color: var(--ink); font-weight: 700; }
.report { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100vw - 32px)); padding: 20px; background: var(--night); border: 2px solid var(--gold); border-radius: 8px; }
.report h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 400; font-size: 24px; }
.report pre { margin: 0 0 12px; padding: 10px; overflow-x: auto; background: #050a1a; border-radius: 6px; font: 13px/1.6 var(--body); white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
.report .row { display: flex; gap: 8px; }
.report button { flex: 1; min-height: 44px; background: none; border: 1.5px solid var(--line); border-radius: 6px; }
#login { display: grid; gap: 8px; margin-bottom: 12px; }
#login input { min-height: 48px; padding: 6px 12px; background: #050a1a; border: 1.5px solid var(--line); border-radius: 6px; color: var(--paper); font: 18px var(--body); -webkit-user-select: text; user-select: text; }
.report button.enter { min-height: 48px; background: var(--gold); border: 0; color: var(--ink); font-weight: 700; }
.fail { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); padding: 20px; background: var(--panel); border-radius: 8px; }
@media (max-aspect-ratio: 1/1) {
  .result { left: 12px; right: 12px; top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: auto; transform: none; }
  .result h2 { font-size: 26px; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="ガチャの3D舞台"></canvas>

<div class="hud meter">
  <div><b id="fps">--</b> コマ/秒 最低 <span id="low">--</span></div>
  <div class="seg" role="group" aria-label="画質">
    <button id="q-high" data-q="high" aria-pressed="true">高画質</button>
    <button id="q-mid" data-q="mid" aria-pressed="false">中</button>
    <button id="q-low" data-q="low" aria-pressed="false">低</button>
  </div>
  <p class="note">動作確認用の見本です。人物の絵は仮のものです。</p>
</div>
<div class="hud tools">
  <button class="tool" id="sound" aria-pressed="true">音あり</button>
  <button class="tool" id="fullscreen">全画面</button>
  <button class="tool" id="measure">15秒計測</button>
  <button class="tool" id="server">保存の確認</button>
</div>
<div class="hud controls" id="controls">
  <button class="pull main" data-pull="random">ガチャを回す</button>
  <button class="pull" data-pull="1">⭐1</button>
  <button class="pull" data-pull="2">⭐2</button>
  <button class="pull" data-pull="3">⭐3</button>
  <button class="pull" data-pull="dup">かぶり</button>
</div>
<div class="hud skip" id="skip" hidden>画面を押すと飛ばせます</div>
<div class="hud result" id="result" hidden aria-live="polite"></div>
<div class="hud report" id="report" hidden>
  <h2>計測の結果</h2>
  <pre id="report-text"></pre>
  <div class="row"><button id="copy">結果をコピー</button><button id="close-report">閉じる</button></div>
</div>
<div class="hud report" id="server-box" hidden>
  <h2>保存の確認</h2>
  <pre id="server-text"></pre>
  <form id="login" hidden>
    <label for="phrase">合言葉</label>
    <input id="phrase" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例：さくら ねこ くじら 42">
    <button class="enter" type="submit">合言葉で入る</button>
  </form>
  <div class="row"><button id="forget" hidden>別の合言葉にする</button><button id="close-server">閉じる</button></div>
</div>
<div class="hud fail" id="fail" hidden>この端末では3Dを表示できませんでした。ほかのブラウザで開くか、ページを読み込み直してください。</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
  // 設定：手順書に沿って書きかえる
  var SAVE_URL = 'ここに保存用のURL';
  var PHRASE_KEY = 'rekishi-phrase';

  var startedAt = performance.now();
  var $ = function (id) { return document.getElementById(id); };
  if (!window.THREE) { $('fail').hidden = false; return; }

  // 見本に使う人物。文は webapp/people.js と同じ。
  var PEOPLE = [
    { name: '織田信長', kana: 'おだのぶなが', mon: '信', rarity: 3, years: '1534〜1582年', page: 'p.133〜134', color: '#a8322a', did: '安土城を築き、楽市・楽座を行った。全国統一を目ざす途中、本能寺で命を落とした。' },
    { name: '卑弥呼', kana: 'ひみこ', mon: '卑', rarity: 3, years: '3世紀ごろ', page: 'p.87', color: '#7b4ea3', did: '邪馬台国の女王。30ほどのくにを従えていた。' },
    { name: '聖徳太子', kana: 'しょうとくたいし', mon: '聖', rarity: 3, years: '574〜622年', page: 'p.96〜97', color: '#2b7a6b', did: '冠位十二階や十七条の憲法をつくり、大陸の文化を政治に生かそうとした。' },
    { name: '西郷隆盛', kana: 'さいごうたかもり', mon: '隆', rarity: 2, years: '1827〜1877年', page: 'p.174〜176', color: '#30568f', did: '薩摩藩の下級武士。勝海舟と話し合い、戦わずに江戸城を明けわたすことを決めた。' },
    { name: '北条政子', kana: 'ほうじょうまさこ', mon: '政', rarity: 2, years: '1157〜1225年', page: 'p.115', color: '#a54470', did: '源頼朝の妻。朝廷が兵を挙げたとき、御家人たちにご恩と奉公をうったえた。' },
    { name: '伊能忠敬', kana: 'いのうただたか', mon: '忠', rarity: 2, years: '1745〜1818年', page: 'p.163', color: '#6d6a2e', did: '50才から天文学や測量術を学び、全国の沿岸を歩いて地図をつくった。' },
    { name: '紫式部', kana: 'むらさきしきぶ', mon: '紫', rarity: 1, years: '10〜11世紀ごろ', page: 'p.106', color: '#6b4aa0', did: 'かな文字で「源氏物語」を書いた。' },
    { name: 'ザビエル', kana: '', mon: 'ザ', rarity: 1, years: '1506〜1552年', page: 'p.134', color: '#3d3d55', did: 'スペインの宣教師。1549年に日本にキリスト教を伝えた。' },
    { name: '坂本龍馬', kana: 'さかもとりょうま', mon: '龍', rarity: 1, years: '1835〜1867年', page: 'p.175', color: '#2f6a8a', did: '土佐に生まれた。対立していた薩摩藩と長州藩を説得した。' }
  ];
  var QUALITY = {
    high: { dpr: 2, ambient: 260, sparks: 220 },
    mid: { dpr: 1.5, ambient: 150, sparks: 120 },
    low: { dpr: 1, ambient: 70, sparks: 60 }
  };
  var TIMING = { // 秒。⭐が高いほど長く見せる
    1: { shake: 0.7, burst: 0.25, hero: 0, rise: 0.8 },
    2: { shake: 1.0, burst: 0.3, hero: 0, rise: 1.0 },
    3: { shake: 1.4, burst: 0.35, hero: 2.4, rise: 1.0 }
  };
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: $('stage'), antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    $('fail').hidden = false;
    return;
  }
  var quality = 'high';
  renderer.setClearColor(0x0b1430);
  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0b1430, 11, 26);
  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 60);

  function canvasTexture(w, h, draw) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  function softDot() {
    return canvasTexture(64, 64, function (g) {
      var r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      r.addColorStop(0, 'rgba(255,255,255,1)');
      r.addColorStop(0.35, 'rgba(255,236,190,.7)');
      r.addColorStop(1, 'rgba(255,200,90,0)');
      g.fillStyle = r; g.fillRect(0, 0, 64, 64);
    });
  }
  var dotTexture = softDot();

  /* 舞台：青海波の床、鳥居、提灯 */
  scene.add(new THREE.HemisphereLight(0x7f9be0, 0x101830, 1.1));
  var keyLight = new THREE.PointLight(0xffc773, 40, 18);
  keyLight.position.set(0, 5, 3);
  scene.add(keyLight);

  var floorTexture = canvasTexture(512, 512, function (g, w, h) {
    g.fillStyle = '#16264f'; g.fillRect(0, 0, w, h);
    g.lineWidth = 3;
    for (var row = 0; row < 9; row++) {
      for (var col = -1; col < 9; col++) {
        var x = col * 64 + (row % 2 ? 32 : 0), y = row * 32 + 32;
        for (var k = 3; k > 0; k--) {
          g.beginPath(); g.arc(x, y, k * 10.5, Math.PI, 0);
          g.strokeStyle = k === 3 ? '#3d5aa0' : '#2a4078';
          g.stroke();
        }
      }
    }
  });
  floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
  floorTexture.repeat.set(5, 5);
  floorTexture.anisotropy = 4;
  var floor = new THREE.Mesh(new THREE.CircleGeometry(16, 48), new THREE.MeshLambertMaterial({ map: floorTexture }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  var shuMaterial = new THREE.MeshLambertMaterial({ color: 0xd8402a, emissive: 0x4a0f06 });
  function bar(w, h, d, x, y, z, material) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material || shuMaterial);
    m.position.set(x, y, z);
    scene.add(m);
    return m;
  }
  [-3.6, 3.6].forEach(function (x) {
    var post = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 6.4, 14), shuMaterial);
    post.position.set(x, 3.2, -2.4);
    scene.add(post);
  });
  bar(9.2, 0.34, 0.5, 0, 6.4, -2.4);
  bar(8.2, 0.24, 0.36, 0, 5.3, -2.4);
  bar(9.8, 0.16, 0.6, 0, 6.66, -2.4, new THREE.MeshLambertMaterial({ color: 0x1b1a22 }));

  var glowMaterial = new THREE.SpriteMaterial({ map: dotTexture, color: 0xffb347, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.5 });
  var lanterns = [];
  [[-5.2, -0.8], [-4.6, 2], [5.2, -0.8], [4.6, 2], [-7.2, -3.4], [7.2, -3.4]].forEach(function (p) {
    var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 1.8, 8), new THREE.MeshLambertMaterial({ color: 0x20243a }));
    pole.position.set(p[0], 0.9, p[1]);
    scene.add(pole);
    var body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.55, 8), new THREE.MeshBasicMaterial({ color: 0xffd28a }));
    body.position.set(p[0], 2.05, p[1]);
    scene.add(body);
    var glow = new THREE.Sprite(glowMaterial);
    glow.position.copy(body.position);
    glow.scale.set(2.6, 2.6, 1);
    scene.add(glow);
    lanterns.push(glow);
  });

  /* 御籤の箱 */
  var box = new THREE.Group();
  box.position.set(0, 0, 0);
  scene.add(box);
  var boxBody = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.8, 2.3, 6), new THREE.MeshLambertMaterial({ color: 0x8c1f18, emissive: 0x2a0806 }));
  boxBody.position.y = 1.15;
  boxBody.rotation.y = Math.PI / 6; // 平らな面を正面に向ける
  box.add(boxBody);
  [0.25, 2.05].forEach(function (y) {
    var band = new THREE.Mesh(new THREE.CylinderGeometry(0.83, 0.85, 0.16, 6), new THREE.MeshLambertMaterial({ color: 0xe0a92e, emissive: 0x3a2800 }));
    band.position.y = y;
    band.rotation.y = Math.PI / 6;
    box.add(band);
  });
  var boxLabel = new THREE.Mesh(new THREE.PlaneGeometry(0.74, 1.24), new THREE.MeshBasicMaterial({
    transparent: true,
    map: canvasTexture(148, 248, function (g, w, h) {
      g.fillStyle = '#fbf7ec'; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#8c1f18'; g.lineWidth = 5; g.strokeRect(8, 8, w - 16, h - 16);
      g.fillStyle = '#1c1a17'; g.font = '56px "Zen Antique", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      ['歴', '史', '札'].forEach(function (ch, i) { g.fillText(ch, w / 2, 56 + i * 68); });
    })
  }));
  boxLabel.position.set(0, 1.15, 0.68);
  box.add(boxLabel);
  var stick = new THREE.Mesh(new THREE.BoxGeometry(0.13, 1.4, 0.05), new THREE.MeshBasicMaterial({ color: 0xffe9b0 }));
  stick.visible = false;
  box.add(stick);

  /* 光の筋 */
  var beams = new THREE.Group();
  beams.position.set(0, 1.9, -1.2);
  scene.add(beams);
  var beamTexture = canvasTexture(32, 256, function (g, w, h) {
    var r = g.createLinearGradient(0, h, 0, 0);
    r.addColorStop(0, 'rgba(255,240,190,1)');
    r.addColorStop(1, 'rgba(255,190,70,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, h);
  });
  for (var bi = 0; bi < 14; bi++) {
    var beam = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 14), new THREE.MeshBasicMaterial({ map: beamTexture, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
    beam.geometry.translate(0, 7, 0);
    beam.rotation.z = bi / 14 * Math.PI * 2;
    beams.add(beam);
  }
  beams.visible = false;
  var flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTexture, color: 0xfff1c4, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0 }));
  flash.position.set(0, 2.2, 1);
  scene.add(flash);

  /* 粒：舞う花びらと、はじける火花 */
  function makePoints(size, color, opacity) {
    var geometry = new THREE.BufferGeometry();
    var material = new THREE.PointsMaterial({ map: dotTexture, size: size, color: color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: opacity, sizeAttenuation: true });
    var pts = new THREE.Points(geometry, material);
    pts.frustumCulled = false;
    scene.add(pts);
    return pts;
  }
  var ambient = makePoints(0.14, 0xffb7c8, 0.8);
  var sparks = makePoints(0.26, 0xffd46b, 1);
  var ambientData = [], sparkData = [];
  function rebuildParticles() {
    var q = QUALITY[quality];
    ambientData = [];
    var a = new Float32Array(q.ambient * 3);
    for (var i = 0; i < q.ambient; i++) {
      ambientData.push({ x: (Math.random() - 0.5) * 20, y: Math.random() * 9, z: (Math.random() - 0.5) * 12 - 1, s: 0.2 + Math.random() * 0.4, p: Math.random() * 6 });
    }
    ambient.geometry.setAttribute('position', new THREE.BufferAttribute(a, 3));
    sparkData = [];
    var b = new Float32Array(q.sparks * 3);
    for (var j = 0; j < q.sparks; j++) sparkData.push({ x: 0, y: -50, z: 0, vx: 0, vy: 0, vz: 0, life: 0 });
    sparks.geometry.setAttribute('position', new THREE.BufferAttribute(b, 3));
  }
  function burst(power) {
    sparkData.forEach(function (s) {
      var a = Math.random() * Math.PI * 2, u = Math.random() * 2 - 1, r = Math.sqrt(1 - u * u), v = power * (0.4 + Math.random() * 0.8);
      s.x = 0; s.y = 2.3; s.z = 0.6;
      s.vx = r * Math.cos(a) * v; s.vy = u * v + 2; s.vz = r * Math.sin(a) * v;
      s.life = 0.8 + Math.random() * 0.9;
    });
  }

  /* カード */
  function roundedStar(g, x, y, r, fill) {
    g.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = i % 2 ? r * 0.46 : r, a = -Math.PI / 2 + i * Math.PI / 5;
      g[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    g.closePath(); g.fillStyle = fill; g.fill();
  }
  function cardFront(person, stars) {
    var gold = stars >= 3;
    return canvasTexture(512, 768, function (g, w, h) {
      g.fillStyle = gold ? '#fff0b8' : '#fbf7ec'; g.fillRect(0, 0, w, h);
      g.strokeStyle = gold ? '#a87a00' : person.color; g.lineWidth = 8; g.strokeRect(22, 22, w - 44, h - 44);
      g.fillStyle = '#1c1a17'; g.font = '92px "Zen Antique", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      var chars = person.name.split('');
      chars.forEach(function (ch, i) { g.fillText(ch, 352, 118 + i * 104); });
      g.font = '30px "BIZ UDPGothic", sans-serif';
      person.kana.split('').forEach(function (ch, i) { g.fillText(ch, 432, 92 + i * (chars.length * 104 / Math.max(person.kana.length, 1))); });
      g.fillStyle = gold ? '#8a6400' : person.color;
      g.beginPath(); g.arc(110, 654, 66, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.font = '76px "Zen Antique", serif'; g.fillText(person.mon, 110, 658);
    });
  }
  var cardBack = canvasTexture(256, 384, function (g, w, h) {
    g.fillStyle = '#b52c1c'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#f5d78a'; g.lineWidth = 6; g.strokeRect(14, 14, w - 28, h - 28);
    g.fillStyle = '#f5d78a'; g.font = '96px "Zen Antique", serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('史', w / 2, h / 2);
  });
  var edge = new THREE.MeshBasicMaterial({ color: 0xe8d9ad });

    }).catch(function (e) {
      var wrong = e && e.message === 'wrong_phrase';
      if (wrong) { remember(null); showLogin('合言葉がちがいます。もう一度入力してください。'); return; }
      out.textContent = lines.concat('失敗 ' + (e && e.message || e)).join('\n');
    });
  }
  $('server').addEventListener('click', checkSave);
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var value = $('phrase').value.trim();
    if (!value) { showLogin('合言葉を入力してください。'); return; }
    remember(value);
    checkSave();
  });
  $('forget').addEventListener('click', function () { remember(null); showLogin('配られた合言葉を入力してください。'); });
  $('close-server').addEventListener('click', function () { $('server-box').hidden = true; });
  addEventListener('resize', resize);

  var fontsReady = document.fonts && document.fonts.load
    ? Promise.race([
        Promise.all([document.fonts.load('92px "Zen Antique"', '歴史札信長'), document.fonts.load('30px "BIZ UDPGothic"', 'おだ')]),
        new Promise(function (ok) { setTimeout(ok, 2500); })
      ])
    : Promise.resolve();
  rebuildParticles();
  resize();
  fontsReady.then(function () {
    // 文字を描いた箱の札は、書体が届いてから描き直す
    boxLabel.material.map = canvasTexture(148, 248, function (g, w, h) {
      g.fillStyle = '#fbf7ec'; g.fillRect(0, 0, w, h);
      g.strokeStyle = '#8c1f18'; g.lineWidth = 5; g.strokeRect(8, 8, w - 16, h - 16);
      g.fillStyle = '#1c1a17'; g.font = '56px "Zen Antique", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      ['歴', '史', '札'].forEach(function (ch, i) { g.fillText(ch, w / 2, 56 + i * 68); });
    });
    boxLabel.material.needsUpdate = true;
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
